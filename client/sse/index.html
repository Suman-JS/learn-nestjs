<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test SSE with Nest.js</title>
    <style>
      *,
      *::after,
      *::before {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        color-scheme: dark light;
        background: #0f0d1a;
        color: white;
      }
      main {
        height: 100dvh;
        width: 100dvw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        & h1 {
          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Oxygen,
            Ubuntu,
            Cantarell,
            "Open Sans",
            "Helvetica Neue",
            sans-serif;
          font-size: 3rem;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Using SSE with Nest.js</h1>
      <h2>Open Console to check if it works or not</h2>
    </main>

    <script>
      const eventSource = new EventSource(
        "http://localhost:3001/v1/sse/events",
      );

      eventSource.onmessage = function (event) {
        console.log("SSE:", JSON.parse(event.data));
      };

      eventSource.onerror = function (err) {
        console.error("SSE error:", err);
      };
    </script>
  </body>
</html>
